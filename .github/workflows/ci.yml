name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio pytest-subtests pillow numpy opencv-python-headless
      - name: Syntax and schema
        run: |
          python -m compileall -q .
          python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Admission and moderation regression tests
        run: python -m pytest tests/test_membership_api_result.py tests/test_provider_streaming.py tests/test_group_review_policy.py tests/test_group_policy_revision.py -q
